name: Validate experimental contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate.py
      - run: python scripts/package.py --target 1.13 --experimental
      - run: python scripts/package.py --target 1.14 --experimental
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-contract-sandbox
          path: dist/*.zip
