 mc_live_hire:0 "Hire real mercenaries (unavailable)"
 mc_live_hire_desc:0 "Locked: independent troop delivery, replenishment, safe release and live pricing must be verified first."
 mc_cancel:0 "Cancel simulation"
 mc_cancel_desc:0 "Pay four weekly fees from the demo account, then withdraw. Requires no outstanding debt."
 mc_renew:0 "Renew simulation for 52 weeks"
 mc_renew_desc:0 "Available in the last four service weeks, without debt. Keeps the contracted weekly rate; no new entry fee."
 mc_topup:0 "Add 100,000 demo funds"
 mc_topup_desc:0 "Changes only the demo account, never the treasury."
 mc_drain:0 "Empty demo account (test arrears)"
 mc_drain_desc:0 "Use during simulated service to observe warnings and termination. Does not clear debt."
 mc_settle:0 "Settle demo debt"
 mc_settle_desc:0 "Uses demo funds, including after withdrawal. Credit strikes remain recorded."
